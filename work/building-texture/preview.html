<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Factmap</title>
    <link rel="stylesheet" href="preview.css">
    <script type="module" src="../../.local/building-texture/model-viewer.min.js"></script>
    <script type="module" src="preview.js"></script>
  </head>
  <body>
    <header>
      <h1 data-copy="title"></h1>
      <nav>
        <button id="language" type="button" data-copy="language"></button>
        <button id="theme" type="button" data-copy="theme"></button>
      </nav>
    </header>
    <main>
      <section class="scene">
        <model-viewer src="../../data/assets/zhemchuzhina/building.glb" camera-controls
          interaction-prompt="none" environment-image="neutral" exposure="1"
          shadow-intensity="0.7" camera-orbit="-115deg 65deg auto"
          touch-action="pan-y" loading="eager"></model-viewer>
        <p id="status" role="status" data-copy="loading"></p>
        <nav class="views">
          <button type="button" data-orbit="-135deg 90deg auto" data-copy="front"></button>
          <button type="button" data-orbit="45deg 90deg auto" data-copy="rear"></button>
          <button type="button" data-orbit="-45deg 90deg auto" data-copy="end"></button>
          <button type="button" data-orbit="0deg 0deg auto" data-copy="roof"></button>
        </nav>
      </section>
      <aside>
        <p data-copy="scope"></p>
        <dl id="facts"></dl>
        <p data-copy="limits"></p>
        <p data-copy="controls"></p>
        <nav>
          <a href="../../data/assets/zhemchuzhina/building.glb" download data-copy="download"></a>
          <a href="../../data/assets/zhemchuzhina/albedo-atlas-v1.png" data-copy="atlas"></a>
        </nav>
        <img src="../../data/assets/zhemchuzhina/albedo-atlas-v1.png" width="1254" height="1254" alt="">
      </aside>
    </main>
  </body>
</html>
