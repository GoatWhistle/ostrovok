name: hotel-evolution
services:
  db:
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    ports: ["127.0.0.1:15435:5432"]
    volumes: ["evolution-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgresql://hotel:hotel@db:5432/hotel?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes: ["/home/ikhail_horokhorin/projects/o-hack-sochi/backend/migrations/postgres:/db/migrations:ro"]
    depends_on:
      db:
        condition: service_healthy
    command: up
  backend:
    image: hotel-sochi-backend:latest
    environment:
      LLM_PROVIDER: fake
      OSTROVOK_SITE: "off"
      DATABASE_URL: postgresql://hotel:hotel@db:5432/hotel
      CHARACTERISTICS_DIR: /srv/characteristics
      SEED_DIR: /srv/data/seed
      MAP_CATALOG_DIR: /srv/map-catalog
      MAP_BASEMAPS_DIR: /srv/basemaps
      PYTHONPATH: /srv/src
    ports: ["127.0.0.1:18085:8000"]
    volumes:
      - /home/ikhail_horokhorin/projects/o-hack-sochi/backend/src:/srv/src:ro
      - /home/ikhail_horokhorin/projects/o-hack-sochi/characteristics:/srv/characteristics:ro
      - /home/ikhail_horokhorin/projects/o-hack-sochi/data:/srv/data:ro
      - /home/ikhail_horokhorin/projects/o-hack-sochi/map-catalog:/srv/map-catalog:ro
      - /mnt/e/o-hack-data/basemaps:/srv/basemaps:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  evolution-db:
