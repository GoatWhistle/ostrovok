<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>README assets</title>
<link rel="stylesheet" href="tokens.css">
<style>
@font-face {
  font-family: "Manrope Variable";
  font-style: normal;
  font-weight: 200 800;
  src: url("fonts/manrope-cyrillic-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}

@font-face {
  font-family: "Manrope Variable";
  font-style: normal;
  font-weight: 200 800;
  src: url("fonts/manrope-latin-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
    U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

html,
body {
  margin: 0;
  background: transparent;
}

body {
  display: grid;
  justify-items: start;
  gap: 32px;
  padding: 48px;
  font-family: var(--font-sans);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

[data-asset] {
  box-sizing: border-box;
}

#generated {
  display: grid;
  justify-items: start;
  gap: 24px;
}

#icons {
  display: none;
}

.banner {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 22px;
  width: 880px;
  height: 200px;
}

.lockup {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
}

.mark {
  display: block;
  width: 72px;
  height: 72px;
}

.mark svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.mark-base {
  fill: var(--mark-side);
}

.mark-accent {
  fill: var(--mark-fact);
}

.wordmark {
  font-size: 76px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.05em;
  text-transform: lowercase;
}

.promise {
  position: relative;
  max-width: 720px;
  margin: 14px 0 0;
  text-align: center;
  font-size: 26px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.015em;
  color: var(--text-secondary);
  text-wrap: balance;
}

.promise em {
  font-style: normal;
  color: var(--text-accent, var(--action-primary));
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 18px 0 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-raised);
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--text-primary);
}

.cta.is-primary {
  border-color: transparent;
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.cta svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.badge {
  display: inline-flex;
  align-items: stretch;
  height: 28px;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
}

.badge > span {
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
}

.badge > .label {
  background: var(--surface-sunken);
  color: var(--text-secondary);
}

.badge > .value {
  background: var(--surface-raised);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.badge.is-accent {
  border-color: var(--action-primary);
}

.badge.is-accent > .value {
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.badge.is-nav {
  height: 26px;
  border-color: var(--border-subtle);
  border-radius: var(--radius-pill);
}

.badge.is-nav > .value {
  padding: 0 12px;
  font-weight: 500;
  color: var(--text-secondary);
}

.badge.is-warning > .value {
  color: var(--text-warning, var(--status-warning));
}

.text {
  display: block;
  line-height: 1;
  text-box: trim-both cap alphabetic;
}
</style>
</head>
<body>

<div class="banner" data-asset="banner">
  <div class="lockup">
    <span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="mark-base" d="M5 14 22 8v42L5 56Z"/><path class="mark-accent" d="M25 8l14 6v42l-14-6Z"/><path class="mark-base" d="M42 14 59 8v42l-17 6Z"/></svg></span>
    <span class="wordmark">factmap</span>
  </div>
  <p class="promise">Ищите словами. <em>Проверяйте на карте.</em></p>
</div>

<span class="mark" data-asset="mark" style="width: 32px; height: 32px"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="mark-base" d="M5 14 22 8v42L5 56Z"/><path class="mark-accent" d="M25 8l14 6v42l-14-6Z"/><path class="mark-base" d="M42 14 59 8v42l-17 6Z"/></svg></span>

<div id="generated"></div>

<div id="icons">
  <svg data-icon="external-link" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
  <svg data-icon="terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></svg>
  <svg data-icon="book-open" viewBox="0 0 24 24"><path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
  <svg data-icon="play" viewBox="0 0 24 24"><path d="M6 3l14 9-14 9z"/></svg>
  <svg data-icon="file-text" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/></svg>
</div>

</body>
</html>
