openapi: 3.0.3
info:
  title: Hotel Agent API
  version: 0.1.0
  description: |
    Контракт бэкенда для 3D-фронта: поиск отелей по найденным агентом свойствам,
    3D-сцена здания, перелёт камеры, подсветка геообъектов свойства, карточка с провенансом.
    Координаты WGS84, порядок [lon, lat] (GeoJSON). Высоты в метрах. Время ISO 8601 UTC.
servers:
  - url: http://localhost:8000/api/v1

tags:
  - name: meta
  - name: search
  - name: hotels
  - name: geo
  - name: map
  - name: hotelier

paths:
  /health:
    get:
      tags: [meta]
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  llm_provider: { type: string, example: fake }

  /regions:
    get:
      tags: [meta]
      operationId: listRegions
      summary: Загруженные регионы и стартовый вид карты
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Region" }

  /characteristics:
    get:
      tags: [meta]
      operationId: listCharacteristics
      summary: Реестр характеристик (для чипов, легенды, цветов подсветки)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Characteristic" }

  /search:
    post:
      tags: [search]
      operationId: searchHotels
      summary: Поиск на естественном языке
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
            example:
              query: тихий номер с видом на закат недалеко от моря
              region_id: sochi
              limit: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }

  /chat/conversations/{conversation_id}:
    get:
      tags: [chat]
      operationId: getConversation
      summary: История диалога и последний результат поиска
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [chat]
      operationId: renameConversation
      summary: Переименовать диалог
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationTitle" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Название пустое или длиннее 80 символов после обрезки пробелов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [chat]
      operationId: deleteConversation
      summary: Удалить диалог вместе с сообщениями
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Удалено
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/messages:
    post:
      tags: [chat]
      operationId: sendChatMessage
      summary: Уточнение поиска с сохранением контекста
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }

  /chat/messages/stream:
    post:
      tags: [chat]
      operationId: streamChatMessage
      summary: Тот же ответ, но событиями по мере готовности
      description: >-
        Поток Server-Sent Events. Событие progress несёт стадию поиска
        (parsing, candidates, research, wish, review) и её поля; событие result —
        тот же Conversation, что возвращает /chat/messages; событие error — конверт ошибки.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                type: string

  /hotels/{hotel_id}:
    get:
      tags: [hotels]
      operationId: getHotelCard
      summary: Карточка отеля со всеми фактами и источниками
      parameters:
        - $ref: "#/components/parameters/HotelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelCard" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hotels/{hotel_id}/offers:
    get:
      tags: [hotels]
      operationId: getHotelOffers
      summary: Актуальные предложения по номерам на даты и состав гостей
      parameters:
        - $ref: "#/components/parameters/HotelId"
        - name: check_in
          in: query
          required: true
          schema: { type: string, format: date }
        - name: check_out
          in: query
          required: true
          schema: { type: string, format: date }
        - name: adults
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 2 }
        - name: residency
          in: query
          schema: { type: string, pattern: "^[a-z]{2}$", default: ru }
      responses:
        "200":
          description: Предложения или честный статус отсутствия данных
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelOffers" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Неверные даты или состав гостей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /hotels/{hotel_id}/details:
    get:
      tags: [hotels]
      operationId: getHotelDetails
      summary: "Сведения отеля у поставщика без дат: фотографии, факты, категории номеров"
      parameters:
        - $ref: "#/components/parameters/HotelId"
      responses:
        "200":
          description: Сведения отеля или честный статус отсутствия данных
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelDetails" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hotels/{hotel_id}/scene:
    get:
      tags: [hotels, geo]
      operationId: getHotelScene
      summary: 3D-сцена здания отеля, фасады, соседи, пресеты камеры
      parameters:
        - $ref: "#/components/parameters/HotelId"
        - name: context_radius_m
          in: query
          schema: { type: integer, default: 250, maximum: 1000 }
          description: Радиус соседних зданий для контекста (0 = без соседей)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelScene" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hotels/{hotel_id}/facts/{fact_id}:
    get:
      tags: [hotels]
      operationId: getFact
      summary: Один факт с полным провенансом и историей
      parameters:
        - $ref: "#/components/parameters/HotelId"
        - $ref: "#/components/parameters/FactId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /geo-features:batch:
    post:
      tags: [geo]
      operationId: getGeoFeatures
      summary: Геометрии по id для подсветки при наведении на свойство
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { type: string }
            example:
              ids: [gf_route_sea_123, gf_poi_n987654321]
      responses:
        "200":
          description: GeoJSON FeatureCollection, порядок как в запросе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoFeatureCollection" }

  /map/catalog:
    get:
      summary: Read OSM rendering classes and classification rules
      operationId: getMapCatalog
      responses:
        '200':
          description: Versioned rendering catalog
          content:
            application/json:
              schema:
                type: object
                required: [version, classes]
                properties:
                  version: { type: string }
                  classes:
                    type: array
                    items: { $ref: '#/components/schemas/MapClass' }

  /map/style:
    get:
      tags: [map]
      operationId: getMapStyle
      summary: Версия и локальные адреса картографических ресурсов региона
      description: >
        Клиент берёт отсюда адреса подложки PMTiles, глифов, спрайта и собственных тайлов, а не
        собирает их из констант. Регион без подложки отвечает 200 с available=false.
      parameters:
        - name: region_id
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9_-]+$", maxLength: 64, example: sochi }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapStyleManifest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }

  /map/scene:
    get:
      tags: [map]
      operationId: getMapScene
      summary: Полные контуры фоновых зданий в ограниченной области для объёмов и окон
      description: >
        Здания, пересекающие bbox, возвращаются целиком с отверстиями. Не больше 800 зданий и
        100 000 вершин; порядок детерминирован расстоянием до центра и id. Условная высота
        отделена от измеренной и не создаёт факт.
      parameters:
        - name: region_id
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9_-]+$", maxLength: 64 }
        - name: bbox
          in: query
          required: true
          description: "west,south,east,north в WGS84; площадь не больше 4 км²"
          schema: { type: string, example: "39.900,43.442,39.909,43.448" }
        - name: zoom
          in: query
          required: true
          schema: { type: number, minimum: 16, maximum: 19 }
        - name: v
          in: query
          required: false
          description: Версия тайлов из /map/style; при расхождении ответ 409
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapRenderScene" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Версия данных изменилась, нужно перечитать /map/style
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidInput" }

  /map/tiles/{z}/{x}/{y}.pbf:
    get:
      tags: [map]
      operationId: getMapTile
      summary: Векторная геометрия импортированного покрытия OpenStreetMap
      description: >-
        Версия lod-v4. buildings: стабильный строковый id, class, class_source,
        height_m, levels, height_source. z10–11: крупные контуры, z12–15: упрощённые,
        z16–19: полные. roads: магистрали с z8, primary с z10, secondary и tertiary
        с z11, остальные с z13; coastline с z8. На z2–11 landcover содержит фактические жилые, коммерческие
        и промышленные полигоны; вне импортированного покрытия геометрия не выдумывается.
        tree_rows: аллеи natural=tree_row с z14. props: отдельные объекты из pois с z16
        (водопады, источники, видовые точки, фонтаны, скамейки, площадки, арт-объекты,
        маяки, исторические объекты) с class каталога, kind исходного тега и name, если он есть.
        Геометрия обрезается с буфером 64/4096 тайла. Для кэширования используйте v=lod-v4.
      parameters:
        - { name: v, in: query, required: false, schema: { type: string }, description: lod-v4; другая версия возвращает 409 }
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 19 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Слои roads, coastline, beaches, buildings, landcover, water, trees, tree_rows, props в формате Mapbox Vector Tile
          headers:
            X-Map-Tile-Version: { schema: { type: string, enum: [lod-v4] } }
          content:
            application/vnd.mapbox-vector-tile:
              schema: { type: string, format: binary }
        "409": { description: Версия тайлов изменилась; перечитайте /map/style }
        "404": { $ref: "#/components/responses/NotFound" }

  /map/terrain/{z}/{x}/{y}.png:
    get:
      tags: [map]
      operationId: getTerrainTile
      summary: Локальный рельеф Сочи из Copernicus DEM в формате Terrain RGB
      parameters:
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 8, maximum: 14 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: PNG с высотами в кодировке Mapbox Terrain RGB
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /map/relief/{z}/{x}/{y}.png:
    get:
      tags: [map]
      operationId: getReliefTile
      summary: Цветной рельеф Сочи из Copernicus DEM
      parameters:
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 8, maximum: 14 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Цветной PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /weather:
    get:
      tags: [weather]
      operationId: getWeather
      summary: Почасовой прогноз для выбранной даты и точки
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: hour, in: query, schema: { type: integer, minimum: 0, maximum: 23, default: 18 } }
      responses:
        "200":
          description: Прогноз MET Norway (CC BY 4.0), время Europe/Moscow, или явная недоступность
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Weather" }

  /compare:
    post:
      tags: [hotels]
      operationId: compareHotels
      summary: Сравнение отелей по характеристикам
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotel_ids]
              properties:
                hotel_ids: { type: array, minItems: 2, maxItems: 5, items: { type: string } }
                characteristic_keys: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  characteristic_keys: { type: array, items: { type: string } }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        hotel_id: { type: string }
                        cells:
                          type: object
                          additionalProperties: { $ref: "#/components/schemas/FactBrief" }

  /places/{place_id}:
    get:
      tags: [geo]
      operationId: getPlace
      summary: Объект OpenStreetMap и путь от выбранного отеля
      parameters:
        - name: place_id
          in: path
          required: true
          schema: { type: string }
        - name: from_hotel
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceCard" }
        "404":
          description: Объект или отель не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /hotelier/{hotel_id}/questions:
    get:
      tags: [hotelier]
      operationId: listHotelierQuestions
      parameters:
        - $ref: "#/components/parameters/HotelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HotelierQuestion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hotelier/questions/{question_id}/answer:
    post:
      tags: [hotelier]
      operationId: answerHotelierQuestion
      parameters:
        - name: question_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 10000 }
            example:
              text: С собаками до 10 кг можно, 1500 ₽ в сутки, кошек тоже берём
      responses:
        "200":
          description: Ответ разложен по полям, созданы факты
          content:
            application/json:
              schema:
                type: object
                properties:
                  question_id: { type: string }
                  extracted:
                    type: array
                    items: { $ref: "#/components/schemas/Fact" }
                  conflicts:
                    type: array
                    items: { $ref: "#/components/schemas/Conflict" }
                  follow_up: { $ref: "#/components/schemas/HotelierQuestion" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "503": { $ref: "#/components/responses/ModelUnavailable" }

  /hotelier/questions/{question_id}:
    patch:
      tags: [hotelier]
      operationId: changeHotelierQuestionStatus
      description: >-
        Откладывает открытый вопрос или возвращает отложенный в работу. Повтор уже достигнутого
        статуса возвращает вопрос без изменений. Отвеченный вопрос этой операцией не меняется:
        его значение исправляется через связанный факт. Переход не меняет факты и не вызывает модель.
      parameters:
        - name: question_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [open, skipped] }
            example:
              status: skipped
      responses:
        "200":
          description: Актуальное состояние вопроса
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelierQuestion" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/QuestionAnswered" }
        "422": { $ref: "#/components/responses/InvalidInput" }

  /facts/{fact_id}/confirm:
    post:
      tags: [hotelier]
      operationId: confirmFact
      description: Повторное подтверждение возвращает тот же факт; superseded и computing дают 422
      parameters:
        - $ref: "#/components/parameters/FactId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }

  /facts/{fact_id}/correct:
    post:
      tags: [hotelier]
      operationId: correctFact
      parameters:
        - $ref: "#/components/parameters/FactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { description: "Значение типа из реестра; false и 0 допустимы" }
                comment: { type: string, maxLength: 10000 }
      responses:
        "200":
          description: Новый факт от отельера, старый superseded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }

components:
  parameters:
    HotelId:
      name: hotel_id
      in: path
      required: true
      schema: { type: string, example: h_osm_w123456789 }
    FactId:
      name: fact_id
      in: path
      required: true
      schema: { type: string, example: f_01JB2X }

  responses:
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidInput:
      description: Значение или переход состояния недопустимы
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ModelUnavailable:
      description: Языковая модель недоступна, состояние не изменено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QuestionAnswered:
      description: Вопрос уже отвечен; статус не изменён, актуальное состояние читается из списка вопросов
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Weather:
      type: object
      required: [status, date, hour]
      properties:
        status: { type: string, enum: [available, unavailable] }
        reason: { type: string, nullable: true }
        date: { type: string, format: date }
        hour: { type: integer }
        temperature_c: { type: number, nullable: true }
        cloud_cover_pct: { type: integer, nullable: true }
        weather_code: { type: integer, nullable: true }
        source: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }

    LonLat:
      type: array
      description: "[lon, lat]"
      minItems: 2
      maxItems: 2
      items: { type: number }
      example: [39.7203, 43.5855]

    BBox:
      type: array
      description: "[min_lon, min_lat, max_lon, max_lat]"
      minItems: 4
      maxItems: 4
      items: { type: number }

    Camera:
      type: object
      description: |
        Параметры для map.flyTo (MapLibre/Mapbox). Для Cesium: target + range_m + heading/pitch.
        bearing направлен на лучший по запросу фасад (азимут фасада + 180).
      required: [center, zoom, pitch, bearing]
      properties:
        center: { $ref: "#/components/schemas/LonLat" }
        zoom: { type: number, example: 17.4 }
        pitch: { type: number, description: "градусы, 0 = сверху", example: 60 }
        bearing: { type: number, description: "градусы от севера по часовой", example: 75 }
        duration_ms: { type: integer, example: 2000 }
        target_alt_m: { type: number, description: "высота точки взгляда над уровнем моря", example: 42.5 }
        range_m: { type: number, description: "дистанция до цели для Cesium", example: 180 }
        focus_facade_id: { type: string, nullable: true, example: fc_h_osm_w123456789_255 }

    Region:
      type: object
      properties:
        id: { type: string, example: sochi }
        name: { type: string, example: Сочи }
        bbox: { $ref: "#/components/schemas/BBox" }
        hotels_count: { type: integer, example: 412 }
        data_as_of: { type: string, format: date, example: "2026-10-20" }
        default_camera: { $ref: "#/components/schemas/Camera" }

    Characteristic:
      type: object
      required: [key, title, value_type, scope]
      properties:
        key: { type: string, example: distance_to_sea }
        title: { type: string, example: Пешком до моря }
        description: { type: string }
        value_type: { type: string, enum: [bool, number, enum, text, object] }
        unit: { type: string, nullable: true, example: min }
        scope: { type: string, enum: [hotel, room, facade] }
        ttl_days: { type: integer, example: 365 }
        compare:
          type: object
          nullable: true
          required: [group]
          properties:
            group: { type: string, enum: [location, view, room, nearby, amenities] }
            better: { type: string, enum: [lower, higher, null], nullable: true }
        source_kinds:
          type: array
          items: { $ref: "#/components/schemas/SourceType" }
        answer_fields:
          type: array
          description: >-
            Поля, из которых складывается ответ отельера и исправление значения, в порядке реестра.
            unit — каноническая единица поля для подписи и текста ответа; null, если единицы нет.
          items:
            type: object
            required: [name, kind, unit]
            properties:
              name: { type: string, example: max_weight_kg }
              kind: { type: string, enum: [bool, number] }
              unit: { type: string, nullable: true, example: кг }
        display:
          type: object
          properties:
            icon: { type: string, example: waves }
            color: { type: string, description: "hex для подсветки", example: "#1E88E5" }
            geo_style: { type: string, enum: [line, points, polygon, viewshed, facade], example: line }

    PlaceCard:
      type: object
      required: [id, name, kind, location, osm_ref, tags, source, facts, walk]
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        kind: { type: string }
        location: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
        osm_ref: { type: string }
        tags: { type: object, additionalProperties: { type: string } }
        source:
          type: object
          required: [type, extracted_at, license, url]
          properties:
            type: { type: string, enum: [osm_tag] }
            extracted_at: { type: string, format: date-time }
            license: { type: string, enum: [ODbL] }
            url: { type: string, format: uri }
        facts:
          type: array
          items: { $ref: "#/components/schemas/FactBrief" }
        walk:
          type: object
          nullable: true
          required: [distance_m, minutes, geo_ref, mode]
          properties:
            distance_m: { type: number, minimum: 0 }
            minutes: { type: number, minimum: 0, nullable: true }
            geo_ref: { type: string }
            mode: { type: string, enum: [graph, straight] }

    SourceType:
      type: string
      enum: [osm, dem, computed, open_meteo, hotelier, llm_extraction, supplier]

    Provenance:
      type: object
      required: [source_type, confidence, computed_at]
      properties:
        source_type: { $ref: "#/components/schemas/SourceType" }
        source_ref: { type: string, nullable: true, example: "osm:way/123456789" }
        source_url: { type: string, nullable: true, example: "https://www.openstreetmap.org/way/123456789" }
        method: { type: string, example: "distance_to_sea@1" }
        confidence: { type: number, minimum: 0, maximum: 1, example: 0.86 }
        observed_at: { type: string, format: date-time, nullable: true }
        computed_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time, nullable: true }
        evidence:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [tag, quote, param, dataset] }
              text: { type: string }

    FactStatus:
      type: string
      enum: [active, conflicted, superseded, confirmed_by_hotelier, stale, computing]

    FactBrief:
      type: object
      description: Лёгкая форма факта для списков и сравнения
      required: [fact_id, characteristic_key, value, label, confidence, source_type, status]
      properties:
        fact_id: { type: string }
        characteristic_key: { type: string }
        value: {}
        unit: { type: string, nullable: true }
        label: { type: string, description: "готовая строка для чипа", example: "6 мин до моря" }
        confidence: { type: number }
        source_type: { $ref: "#/components/schemas/SourceType" }
        status: { $ref: "#/components/schemas/FactStatus" }
        subject: { type: string, nullable: true }
        qualifiers: { type: object, additionalProperties: true }
        geo_refs:
          type: array
          description: id геообъектов для подсветки (см. /geo-features:batch)
          items: { type: string }

    Fact:
      allOf:
        - $ref: "#/components/schemas/FactBrief"
        - type: object
          properties:
            subject: { type: string, example: "hotel:h_osm_w123456789" }
            qualifiers:
              type: object
              additionalProperties: true
              example: { from_floor: 5, months: [4, 5, 6, 7, 8], facade_azimuth: 255 }
            explanation: { type: string, example: "Закат виден с 5-го этажа западной стороны, апрель–август" }
            provenance: { $ref: "#/components/schemas/Provenance" }

    FactDetail:
      allOf:
        - $ref: "#/components/schemas/Fact"
        - type: object
          properties:
            history:
              type: array
              items: { $ref: "#/components/schemas/Fact" }
            conflicts:
              type: array
              items: { $ref: "#/components/schemas/Conflict" }

    Conflict:
      type: object
      required: [id, characteristic_key, fact_ids, resolution, rule]
      properties:
        id: { type: string }
        characteristic_key: { type: string }
        fact_ids: { type: array, items: { type: string } }
        resolution: { type: string, enum: [pending, resolved_by_rule, resolved_by_hotelier] }
        winner_fact_id: { type: string, nullable: true }
        rule: { type: string, example: "hotelier > fresh_computed > osm_tag" }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        region_id: { type: string, nullable: true, example: russia }
        bbox: { $ref: "#/components/schemas/BBox" }
        limit: { type: integer, default: 20, maximum: 100 }
        cursor: { type: string, nullable: true }
        compute_missing:
          type: boolean
          default: true
          description: Разрешить агенту досчитывать редкие характеристики для top-N

    ParsedIntent:
      type: object
      properties:
        characteristic_key: { type: string, example: sunset_view }
        op: { type: string, enum: [eq, lte, gte, exists, near], example: eq }
        value: { example: true }
        weight: { type: number, example: 1.0 }
        required: { type: boolean, example: false }
        source_text: { type: string, example: "с видом на закат" }

    QueryCorrection:
      type: object
      required: [original, corrected, reason]
      properties:
        original: { type: string, example: "в Соче" }
        corrected: { type: string, example: "в Сочи" }
        reason: { type: string, example: "Исправлена опечатка в названии города" }

    MatchedProperty:
      type: object
      description: Свойство, найденное агентом и показанное в выдаче. Наведение = подсветка geo_refs.
      required: [characteristic_key, match, label]
      properties:
        characteristic_key: { type: string }
        match: { type: string, enum: [full, partial, none, unknown, computing] }
        margin:
          description: >-
            Запас измерения относительно порога, выше единицы — с запасом, ниже — впритык.
            Есть только там, где у условия числовой порог; для «да/нет» отсутствует.
          type: number
          nullable: true
          example: 1.4
        label: { type: string, example: "Закат с 5-го этажа" }
        explanation: { type: string, example: "Закат есть, но только с 5-го этажа западной стороны" }
        fact: { $ref: "#/components/schemas/FactBrief" }
        geo_refs: { type: array, items: { type: string } }
        camera: { $ref: "#/components/schemas/Camera" }

    HotelSummary:
      type: object
      required: [id, name, location]
      properties:
        id: { type: string, example: h_osm_w123456789 }
        name: { type: string, example: Гостиница «Приморская» }
        stars: { type: integer, nullable: true, example: 4 }
        address: { type: string, nullable: true }
        location: { $ref: "#/components/schemas/LonLat" }
        building_id: { type: string, example: b_osm_w123456789 }
        height_m: { type: number, example: 28.8 }
        levels: { type: integer, nullable: true, example: 9 }
        thumbnail_url: { type: string, nullable: true }
        photos:
          type: array
          description: Stored source photos, independent of availability lookup
          items: { $ref: "#/components/schemas/HotelPhoto" }

    HotelPhoto:
      type: object
      required: [url, kind]
      properties:
        url: { type: string, format: uri }
        source_url: { type: string, nullable: true, format: uri }
        kind: { type: string, enum: [hotel, room, surroundings] }

    SearchResult:
      type: object
      required: [hotel, score, matched]
      properties:
        hotel: { $ref: "#/components/schemas/HotelSummary" }
        score:
          description: Доля выполненных условий с учётом качества совпадения, без уверенности.
          type: number
          example: 0.82
        confidence:
          description: Общая уверенность в подтверждённых условиях, отдельно от соответствия.
          type: number
          example: 0.74
        matched:
          type: array
          items: { $ref: "#/components/schemas/MatchedProperty" }
        camera: { $ref: "#/components/schemas/Camera" }
        footprint:
          description: Упрощённый контур для отрисовки всех результатов сразу (MapLibre fill-extrusion)
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BuildingFeature"

    SearchResponse:
      type: object
      required: [query_id, parsed, results]
      properties:
        query_id: { type: string }
        parsed:
          type: object
          properties:
            intents:
              type: array
              items: { $ref: "#/components/schemas/ParsedIntent" }
            unmatched_terms: { type: array, items: { type: string } }
            location_hint: { type: string, nullable: true }
            anywhere: { type: boolean, description: Пользователь явно разрешил поиск без ограничения по городу }
            normalized_query: { type: string, nullable: true }
            corrections:
              type: array
              items: { $ref: "#/components/schemas/QueryCorrection" }
            unsupported_region: { type: string, nullable: true }
            needs_clarification: { type: boolean }
            wants_room: { type: boolean }
            room_preferences_unrestricted: { type: boolean }
            budget: { type: string, nullable: true }
            check_in: { type: string, format: date, nullable: true }
            check_out: { type: string, format: date, nullable: true }
            adults: { type: integer, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        viewport:
          type: object
          nullable: true
          description: Рамка для fitBounds по всем результатам
          properties:
            bbox: { $ref: "#/components/schemas/BBox" }
            camera: { $ref: "#/components/schemas/Camera" }
        pending:
          type: array
          description: Характеристики, которые агент ещё считает; повторить поиск с тем же query_id позже
          items:
            type: object
            properties:
              hotel_id: { type: string }
              characteristic_key: { type: string }
        next_cursor: { type: string, nullable: true }
        took_ms: { type: integer }

    BuildingFeature:
      type: object
      description: GeoJSON Feature здания
      required: [type, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: string }
        geometry:
          type: object
          description: Polygon | MultiPolygon
        properties:
          type: object
          properties:
            building_id: { type: string }
            hotel_id: { type: string, nullable: true }
            is_hotel: { type: boolean }
            height_m: { type: number }
            min_height_m: { type: number, default: 0 }
            levels: { type: integer, nullable: true }
            ground_elevation_m: { type: number, description: "отметка земли по DEM" }
            roof_shape: { type: string, nullable: true, example: flat }
            height_fact_id: { type: string, description: "факт building_height с провенансом" }

    Facade:
      type: object
      description: Сторона здания; на неё вешаются факты scope=facade (шум, закат)
      properties:
        id: { type: string, example: fc_h_osm_w123456789_255 }
        azimuth_deg: { type: number, description: "направление нормали наружу", example: 255 }
        label: { type: string, example: Запад }
        geometry:
          type: object
          description: GeoJSON LineString по ребру footprint
        facts:
          type: array
          items: { $ref: "#/components/schemas/FactBrief" }

    HotelScene:
      type: object
      required: [hotel_id, building, cameras]
      properties:
        hotel_id: { type: string }
        building:
          type: object
          description: FeatureCollection зданий отеля (корпуса)
          properties:
            type: { type: string, enum: [FeatureCollection] }
            features:
              type: array
              items: { $ref: "#/components/schemas/BuildingFeature" }
        facades:
          type: array
          items: { $ref: "#/components/schemas/Facade" }
        context_buildings:
          type: object
          properties:
            type: { type: string, enum: [FeatureCollection] }
            features:
              type: array
              items: { $ref: "#/components/schemas/BuildingFeature" }
        cameras:
          type: object
          properties:
            overview: { $ref: "#/components/schemas/Camera" }
            best_match: { $ref: "#/components/schemas/Camera" }
            by_facade:
              type: object
              additionalProperties: { $ref: "#/components/schemas/Camera" }
        terrain:
          type: object
          nullable: true
          properties:
            dem_source: { type: string, example: Mapterhorn }
            terrain_tiles_url: { type: string, nullable: true }

    GeoFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: string, example: gf_route_sea_123 }
        geometry: { type: object }
        properties:
          type: object
          properties:
            kind: { type: string, enum: [route, poi, area, line, viewshed, facade] }
            characteristic_key: { type: string }
            name: { type: string, nullable: true }
            label: { type: string, nullable: true, example: "480 м, 6 мин, −22 м" }
            osm_ref: { type: string, nullable: true }
            style_hint: { type: string, nullable: true }
            place_id: { type: string }
            hotel_id: { type: string }
            distance_m: { type: number, minimum: 0 }
            minutes: { type: number, minimum: 0, nullable: true }
            mode: { type: string, enum: [graph, straight] }

    MapRenderScene:
      type: object
      required: [region_id, version, bbox, features, truncated, eligible_count]
      properties:
        region_id: { type: string }
        version: { type: string, nullable: true }
        bbox: { $ref: "#/components/schemas/BBox" }
        truncated: { type: boolean }
        eligible_count: { type: integer, minimum: 0 }
        features:
          type: array
          items: { $ref: "#/components/schemas/MapRenderBuilding" }

    MapRenderBuilding:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: string }
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [Polygon, MultiPolygon] }
            coordinates: { type: array, items: {} }
        properties:
          type: object
          required: [building_id, hotel_id, class, class_source, height_m, levels, height_source, render_height_m, height_estimated, min_height_m, ground_elevation_m, ground_source]
          properties:
            building_id: { type: string }
            hotel_id: { type: string, nullable: true }
            class: { type: string }
            class_source: { type: string }
            height_m: { type: number, nullable: true }
            levels: { type: integer, nullable: true }
            height_source: { type: string }
            render_height_m: { type: number, minimum: 0 }
            height_estimated: { type: boolean }
            min_height_m: { type: number, minimum: 0 }
            ground_elevation_m: { type: number, nullable: true }
            ground_source: { type: string, nullable: true }

    MapStyleManifest:
      type: object
      required: [region_id, available, reason, bbox, version, catalog_version, tiles_version, assets, capabilities]
      properties:
        region_id: { type: string }
        available: { type: boolean }
        reason: { type: string, nullable: true, enum: [basemap_missing, null] }
        bbox: { $ref: "#/components/schemas/BBox" }
        version: { type: string, nullable: true, description: "Версия подложки; меняется вместе с именем архива" }
        catalog_version: { type: string }
        tiles_version: { type: string, nullable: true }
        assets:
          type: object
          nullable: true
          required: [basemap_url, glyphs_url, sprite_url, vector_tiles_url, terrain_tiles_url, min_zoom, max_zoom]
          properties:
            basemap_url: { type: string, example: /maps/sochi/sochi-basemap-142dbe50d10e.pmtiles }
            glyphs_url: { type: string, example: "/maps/sochi/fonts/{fontstack}/{range}.pbf" }
            sprite_url: { type: string, example: /maps/sochi/sprites/black }
            vector_tiles_url: { type: string, example: "/api/v1/map/tiles/{z}/{x}/{y}.pbf" }
            terrain_tiles_url: { type: string, nullable: true, example: "/api/v1/map/terrain/{z}/{x}/{y}.png" }
            min_zoom: { type: integer }
            max_zoom: { type: integer }
        capabilities:
          type: object
          required: [terrain, render_scene]
          properties:
            terrain: { type: boolean }
            render_scene: { type: boolean }

    MapCatalog:
      type: object
      required: [version, classes]
      properties:
        version: { type: string }
        classes:
          type: array
          items: { $ref: '#/components/schemas/MapClass' }

    MapClass:
      type: object
      required: [key, layer, match, priority, min_zoom, style]
      properties:
        key: { type: string }
        layer: { type: string, enum: [ground, volume, prop, poi] }
        match:
          type: array
          items:
            type: object
            required: [tag, values]
            properties:
              tag: { type: string }
              values: { type: array, items: { type: string } }
        priority: { type: integer }
        min_zoom: { type: integer, minimum: 0, maximum: 22 }
        style:
          type: object
          additionalProperties: { type: string }
        props:
          type: object
          nullable: true
          additionalProperties: {}

    GeoFeatureCollection:
      type: object
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features:
          type: array
          items: { $ref: "#/components/schemas/GeoFeature" }

    HotelCard:
      type: object
      required: [hotel, facts]
      properties:
        hotel: { $ref: "#/components/schemas/HotelSummary" }
        rooms:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              capacity: { type: integer }
              floor_range: { type: array, items: { type: integer }, nullable: true }
              facade_ids: { type: array, items: { type: string } }
              price_amount: { type: number, nullable: true }
              price_currency: { type: string, nullable: true }
              included: { type: array, items: { type: string } }
              facts:
                type: array
                items: { $ref: "#/components/schemas/FactBrief" }
        facilities_ru: { type: array, items: { type: string } }
        facilities_en: { type: array, items: { type: string } }
        facts:
          type: array
          description: Активные факты, по одному победителю на характеристику и субъект
          items: { $ref: "#/components/schemas/Fact" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/Conflict" }
        stale_count: { type: integer }
        open_questions: { type: integer }
        camera: { $ref: "#/components/schemas/Camera" }

    HotelDetails:
      type: object
      required: [hotel_id, status, sandbox, room_groups]
      properties:
        hotel_id: { type: string }
        status:
          type: string
          enum: [provider_unavailable, hotel_unmapped, provider_error, available]
        source: { type: string, nullable: true }
        sandbox: { type: boolean }
        details:
          allOf: [{ $ref: "#/components/schemas/SupplierDetails" }]
          nullable: true
          description: Сведения отеля из каталога поставщика, подтверждённые по адресу и координатам
        room_groups:
          type: array
          description: Категории номеров поставщика без привязки к датам и тарифам
          items: { $ref: "#/components/schemas/SupplierRoom" }

    HotelOffers:
      type: object
      required: [hotel_id, check_in, check_out, adults, status, sandbox, offers]
      properties:
        hotel_id: { type: string }
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        adults: { type: integer }
        status:
          type: string
          enum: [provider_unavailable, hotel_unmapped, provider_error, no_offers, available]
        source: { type: string, nullable: true }
        sandbox: { type: boolean }
        checked_at: { type: string, format: date-time, nullable: true }
        facilities: { type: array, items: { type: string }, description: Supplier facility codes; not necessarily included in the rate }
        room_categories: { type: array, items: { type: string }, description: Catalog categories; availability is only represented by offers }
        photo_url: { type: string, nullable: true }
        rates_complete: { type: boolean, description: Full hotel-page rate response loaded }
        room_groups:
          type: array
          items: { $ref: "#/components/schemas/SupplierRoom" }
        details:
          allOf: [{ $ref: "#/components/schemas/SupplierDetails" }]
          nullable: true
          description: Сведения отеля из каталога поставщика, подтверждённые по адресу и координатам
        declared_rooms:
          type: array
          items: { $ref: "#/components/schemas/SupplierRoom" }
          description: "Категории из публичной карточки другого поставщика: заполняются, когда основной источник не публикует вид из окна и этаж"
        declared_card: { type: string, nullable: true, description: "Адрес публичной карточки, из которой взяты declared_rooms" }
        offers:
          type: array
          items: { $ref: "#/components/schemas/RoomOffer" }

    RoomOffer:
      type: object
      required: [id, room_name, price_amount, price_currency, available_rooms, amenities]
      properties:
        id: { type: string }
        room_name: { type: string }
        price_amount: { type: number }
        price_currency: { type: string }
        available_rooms: { type: integer, nullable: true }
        meal: { type: string, nullable: true }
        amenities: { type: array, items: { type: string } }
        floor_number: { type: integer, nullable: true, description: "Этаж номера; заполняется только источником, который его публикует" }
        room_group_id: { type: string, nullable: true }
        free_cancellation_before: { type: string, format: date-time, nullable: true }
        occupancy: { type: integer, nullable: true, description: "Число гостей, на которое поставщик посчитал этот тариф" }
        bed_places:
          allOf: [{ $ref: "#/components/schemas/BedPlaces" }]
          nullable: true

    BedPlaces:
      type: object
      required: [main, extra, child_cots, bedding]
      description: "Спальные места тарифа по данным поставщика; не максимальная вместимость категории"
      properties:
        main: { type: integer, description: Основные места }
        extra: { type: integer, description: Дополнительные места }
        child_cots: { type: integer, description: Детские кроватки }
        bedding: { type: array, items: { type: string }, description: Коды типов кроватей поставщика }

    SupplierRoom:
      type: object
      required: [id, name, photos, amenities, views]
      properties:
        id: { type: string }
        name: { type: string }
        photos: { type: array, items: { type: string } }
        amenities: { type: array, items: { type: string } }
        size_sqm: { type: number, nullable: true }
        bedding: { type: string, nullable: true }
        views:
          type: array
          items: { type: string }
          description: "Нормализованные цели вида из окна, объявленные поставщиком для этой категории"
        floor: { type: integer, nullable: true, description: "Этаж категории по карточке поставщика" }
        main_places: { type: integer, nullable: true, description: "Основные места в категории" }
        extra_places: { type: integer, nullable: true, description: "Дополнительные места в категории" }


    SupplierPhoto:
      type: object
      required: [url]
      properties:
        url: { type: string }
        category: { type: string, nullable: true }

    SupplierAmenity:
      type: object
      required: [name, free]
      properties:
        name: { type: string }
        free: { type: boolean, description: Поставщик отметил услугу бесплатной }

    SupplierAmenityGroup:
      type: object
      required: [name, amenities]
      properties:
        name: { type: string }
        amenities:
          type: array
          items: { $ref: "#/components/schemas/SupplierAmenity" }

    SupplierDescriptionSection:
      type: object
      required: [title, paragraphs]
      properties:
        title: { type: string }
        paragraphs: { type: array, items: { type: string } }

    SupplierNearbyPlace:
      type: object
      required: [name, distance_m]
      properties:
        name: { type: string }
        distance_m: { type: integer, description: Расстояние по данным поставщика }
        kind: { type: string, nullable: true }

    SupplierRegistryCategory:
      type: object
      required: [category, rooms]
      properties:
        category: { type: string }
        rooms: { type: integer }

    SupplierRegistry:
      type: object
      required: [record, categories]
      description: Запись в реестре классифицированных объектов размещения
      properties:
        record: { type: string }
        name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        link: { type: string, nullable: true }
        categories:
          type: array
          items: { $ref: "#/components/schemas/SupplierRegistryCategory" }
        valid_until: { type: string, format: date, nullable: true, description: "Дата окончания действия свидетельства о присвоении категории" }

    SupplierFacts:
      type: object
      description: Опубликованные поставщиком факты об отеле; отсутствующее поле означает неизвестность
      properties:
        floors_number: { type: integer, nullable: true }
        rooms_number: { type: integer, nullable: true }
        star_rating: { type: integer, nullable: true }
        year_built: { type: integer, nullable: true }
        year_renovated: { type: integer, nullable: true }
        kind: { type: string, nullable: true }
        hotel_wifi: { type: boolean, nullable: true }
        room_wifi: { type: boolean, nullable: true }
        registry:
          allOf: [{ $ref: "#/components/schemas/SupplierRegistry" }]
          nullable: true

    SupplierRatingScore:
      type: object
      required: [name, score]
      properties:
        name: { type: string }
        score: { type: number }

    SupplierRating:
      type: object
      required: [detailed]
      properties:
        total: { type: number, nullable: true, description: Оценка по десятибалльной шкале }
        reviews_count: { type: integer, nullable: true }
        detailed:
          type: array
          items: { $ref: "#/components/schemas/SupplierRatingScore" }

    SupplierDetails:
      type: object
      required: [supplier_id, page_url, name, photos, facts, amenity_groups, description, nearby]
      properties:
        supplier_id: { type: string }
        page_url: { type: string, description: Страница отеля у поставщика }
        name: { type: string }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        location:
          type: array
          nullable: true
          items: { type: number }
          minItems: 2
          maxItems: 2
          description: "[долгота, широта] по данным поставщика"
        photos:
          type: array
          items: { $ref: "#/components/schemas/SupplierPhoto" }
        facts: { $ref: "#/components/schemas/SupplierFacts" }
        amenity_groups:
          type: array
          items: { $ref: "#/components/schemas/SupplierAmenityGroup" }
        description:
          type: array
          items: { $ref: "#/components/schemas/SupplierDescriptionSection" }
        nearby:
          type: array
          items: { $ref: "#/components/schemas/SupplierNearbyPlace" }
        rating:
          allOf: [{ $ref: "#/components/schemas/SupplierRating" }]
          nullable: true
        check_in_from: { type: string, nullable: true }
        check_out_until: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }

    ChatRequest:
      type: object
      required: [message]
      properties:
        conversation_id: { type: string, format: uuid, nullable: true }
        message: { type: string, minLength: 1, maxLength: 2000 }
        region_id: { type: string, default: russia }
        selected_hotel_id: { type: string, nullable: true }
        locale: { type: string, enum: [ru, en], default: ru }
    ChatMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }
    ConversationTitle:
      type: object
      required: [title]
      properties:
        title: { type: string, description: "1–80 символов после обрезки пробелов" }
    Conversation:
      type: object
      required: [id, title, updated_at, messages]
      properties:
        search_message_id:
          type: string
          format: uuid
          nullable: true
          description: ID ответа, создавшего текущую выдачу. Консультации сохраняют его; открытие чата не запускает поиск.
        id: { type: string, format: uuid }
        title:
          type: string
          nullable: true
          description: Название из распознанного запроса или заданное пользователем
        updated_at: { type: string, format: date-time, nullable: true }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        effective_query: { type: string, nullable: true }
        search:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/SearchResponse" }

    HotelierQuestion:
      type: object
      required: [id, hotel_id, characteristic_key, text, reason, status, created_at]
      properties:
        id: { type: string }
        hotel_id: { type: string }
        characteristic_key: { type: string }
        text: { type: string, example: "Какие номера выходят окнами на запад?" }
        reason: { type: string, enum: [missing, conflict, stale, low_confidence] }
        status: { type: string, enum: [open, answered, skipped] }
        created_at: { type: string, format: date-time }
        answer_text:
          type: string
          nullable: true
          description: Последний сохранённый текст ответа отельера, в том числе потребовавший уточнения
        answered_at:
          type: string
          format: date-time
          nullable: true
          description: Время сохранения этого ответа
        answer_fact_ids:
          type: array
          description: >-
            Факты, созданные из ответа на этот вопрос (по источнику hotelier), в порядке создания.
            Текущую версию факта даёт его история; пустой массив означает, что связь не сохранена.
          items: { type: string }
