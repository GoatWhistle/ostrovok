[project]
name = "hotel-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "osmium>=4.3.2",
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.2",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
hotel-agent = "hotel_agent.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "jsonschema>=4.26.0",
    "mypy>=1.18",
    "openapi-spec-validator>=0.9.0",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-xdist>=3.8",
    "ruff>=0.14",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_agent"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--strict-markers"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
mypy_path = "src:."
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]

# rasterio ships no py.typed marker; its own API is exercised in tests/unit/adapters/geo/
[[tool.mypy.overrides]]
module = ["rasterio.*", "shapely.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["hotel_agent"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inwards"
type = "layers"
layers = ["hotel_agent.interfaces | hotel_agent.adapters", "hotel_agent.application", "hotel_agent.domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain and application stay free of frameworks"
type = "forbidden"
source_modules = ["hotel_agent.domain", "hotel_agent.application"]
forbidden_modules = ["fastapi", "pydantic", "starlette", "psycopg", "yaml", "httpx", "anthropic", "openai"]

[[tool.importlinter.contracts]]
name = "Composition root is not imported by the layers"
type = "forbidden"
source_modules = ["hotel_agent.domain", "hotel_agent.application", "hotel_agent.adapters", "hotel_agent.interfaces"]
forbidden_modules = ["hotel_agent.main", "hotel_agent.composition", "hotel_agent.settings"]
